<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — Кубик &amp; Ко</title>
  <meta name="description" content="Каталог настольных игр магазина «Кубик & Ко».">
  <link rel="stylesheet" href="Style.css">
  <link rel="icon" href="images/logo.jpg" type="image/jpeg">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">
        <img src="images/logo.jpg" alt="Логотип Кубик и Ко">
        <span class="logo-text">Кубик <span>&amp;</span> Ко</span>
      </a>
      <nav class="nav" aria-label="Основное меню">
        <a href="index.html">Главная</a>
        <a class="active" href="catalog.html">Каталог</a>
        <a href="contacts.html">Контакты</a>
        <a href="db.html" class="nav-db" hidden>БД</a>
      </nav>
      <div class="auth-slot" id="auth-slot"></div>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="breadcrumb"><a href="index.html">Главная</a> · Каталог</p>
        <h1>Каталог игр</h1>
        <p class="section-lead">Выберите игру и оформите заказ онлайн.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="catalog catalog--full" id="catalog-grid"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026 Кубик &amp; Ко</p>
      <p><a href="contacts.html">ул. Игровая, 28 · +7 (812) 555-28-28</a></p>
    </div>
  </footer>

  <script src="js/games.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      const grid = document.getElementById("catalog-grid");
      if (!grid || !window.KUBIK_GAMES) return;
      grid.innerHTML = window.KUBIK_GAMES.map(function (g) {
        return (
          '<a class="game-card game-card--link" href="product.html?id=' + g.id + '">' +
            '<img src="' + g.image + '" alt="' + g.short + '">' +
            '<div class="game-card-body">' +
              "<h3>" + g.short + "</h3>" +
              '<p class="game-meta">' + g.players + " игроков · " + g.time + " · " + g.age + "</p>" +
              '<p class="price">' + g.price.toLocaleString("ru-RU") + " ₽</p>" +
              '<span class="btn btn-primary btn-sm">Купить</span>' +
            "</div>" +
          "</a>"
        );
      }).join("");
    })();
  </script>
</body>
</html>
