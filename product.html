<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Товар — Кубик &amp; Ко</title>
  <meta name="description" content="Карточка настольной игры в магазине «Кубик & Ко».">
  <link rel="stylesheet" href="Style.css">
  <link rel="icon" href="images/logo.jpg" type="image/jpeg">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">
        <img src="images/logo.jpg" alt="Логотип Кубик и Ко">
        <span class="logo-text">Кубик <span>&amp;</span> Ко</span>
      </a>
      <nav class="nav" aria-label="Основное меню">
        <a href="index.html">Главная</a>
        <a class="active" href="catalog.html">Каталог</a>
        <a href="contacts.html">Контакты</a>
        <a href="db.html" class="nav-db" hidden>БД</a>
      </nav>
      <div class="auth-slot" id="auth-slot"></div>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="breadcrumb" id="product-breadcrumb">
          <a href="index.html">Главная</a> · <a href="catalog.html">Каталог</a>
        </p>
      </div>
    </section>

    <section class="container product-layout">
      <div class="product-gallery" data-reveal>
        <img id="product-image" src="images/product-main.jpg" alt="">
      </div>

      <div class="product-info" data-reveal>
        <span class="badge" id="product-badge" hidden>Игра недели</span>
        <h1 id="product-title">Загрузка…</h1>
        <p class="product-desc" id="product-desc"></p>
        <p class="product-price" id="product-price"></p>

        <dl class="specs" id="product-specs"></dl>

        <div class="composition">
          <h2>Состав коробки</h2>
          <ul id="product-box"></ul>
        </div>

        <div class="order-panel" id="order-panel">
          <h2>Оформить заказ</h2>
          <p class="hint">Войдите в аккаунт, укажите контакты и способ получения.</p>

          <form id="form-order" class="order-form" data-price="2490" data-product="" novalidate>
            <label>Имя получателя
              <input type="text" name="customer" required minlength="2" placeholder="Иван Иванов" autocomplete="name">
            </label>
            <label>Телефон
              <input type="tel" name="phone" required placeholder="+7 (9XX) XXX-XX-XX" autocomplete="tel">
            </label>
            <label>Способ получения
              <select name="delivery" required>
                <option value="pickup">Самовывоз из магазина</option>
                <option value="courier">Курьер по городу</option>
                <option value="post">СДЭК / Почта</option>
              </select>
            </label>

            <div class="qty-row">
              <span class="qty-label">Количество</span>
              <div class="qty-controls">
                <button type="button" class="qty-btn" data-qty="-1" aria-label="Меньше">−</button>
                <input type="number" name="qty" value="1" min="1" max="10" inputmode="numeric">
                <button type="button" class="qty-btn" data-qty="1" aria-label="Больше">+</button>
              </div>
            </div>

            <div class="order-total-row">
              <span>Итого</span>
              <span id="order-total">0 ₽</span>
            </div>

            <p class="form-error" hidden></p>
            <button type="submit" class="btn btn-primary btn-block">Отправить заказ</button>
          </form>

          <div id="order-success" class="order-success" hidden></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026 Кубик &amp; Ко</p>
      <p><a href="contacts.html">ул. Игровая, 28 · +7 (812) 555-28-28</a></p>
    </div>
  </footer>

  <script src="js/games.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const game = window.getKubikGame(params.get("id") || "carcassonne");
      document.title = game.title + " — Кубик & Ко";
      document.getElementById("product-breadcrumb").innerHTML =
        '<a href="index.html">Главная</a> · <a href="catalog.html">Каталог</a> · ' + game.short;
      document.getElementById("product-image").src = game.image;
      document.getElementById("product-image").alt = game.title;
      document.getElementById("product-title").textContent = game.title;
      document.getElementById("product-desc").textContent = game.desc;
      document.getElementById("product-price").textContent = game.price.toLocaleString("ru-RU") + " ₽";
      const badge = document.getElementById("product-badge");
      if (game.badge) {
        badge.hidden = false;
        badge.textContent = game.badge;
      }
      document.getElementById("product-specs").innerHTML =
        "<div class='spec'><dt>Игроки</dt><dd>" + game.players + " человек</dd></div>" +
        "<div class='spec'><dt>Время партии</dt><dd>" + game.time + "</dd></div>" +
        "<div class='spec'><dt>Возраст</dt><dd>от " + game.age.replace("+", "") + " лет</dd></div>" +
        "<div class='spec'><dt>Жанр</dt><dd>" + game.genre + "</dd></div>" +
        "<div class='spec'><dt>Сложность</dt><dd>" + game.difficulty + "</dd></div>" +
        "<div class='spec'><dt>Издатель</dt><dd>" + game.publisher + "</dd></div>";
      document.getElementById("product-box").innerHTML = game.box
        .map(function (item) { return "<li>" + item + "</li>"; })
        .join("");
      const form = document.getElementById("form-order");
      form.dataset.price = String(game.price);
      form.dataset.product = game.title;
      document.getElementById("order-total").textContent =
        game.price.toLocaleString("ru-RU") + " ₽";
    })();
  </script>
</body>
</html>
